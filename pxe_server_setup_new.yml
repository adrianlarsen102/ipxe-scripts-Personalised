---
- name: Setup iPXE Boot Server (DHCP, TFTP, Nginx)
  hosts: all
  become: yes
  tasks:

    # Step 1: Update apt and install required packages
    - name: Update apt and upgrade system
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install necessary packages for DHCP, TFTP, Nginx, and iPXE
      apt:
        name:
          - isc-dhcp-server
          - tftpd-hpa
          - nginx
          - wget
          - curl
        state: present

    # Step 2: Configure DHCP Server
    - name: Configure ISC DHCP server
      template:
        src: dhcpd.conf.j2
        dest: /etc/dhcp/dhcpd.conf
      notify:
        - restart isc-dhcp-server

    - name: Ensure ISC DHCP server is running
      service:
        name: isc-dhcp-server
        state: restarted
        enabled: yes

    # Step 3: Configure TFTP Server
    - name: Configure TFTP server
      template:
        src: tftpd-hpa.j2
        dest: /etc/default/tftpd-hpa
      notify:
        - restart tftpd-hpa

    - name: Ensure TFTP server is running
      service:
        name: tftpd-hpa
        state: restarted
        enabled: yes

    # Step 4: Configure Nginx for iPXE HTTP Boot
    - name: Create Nginx root directory for iPXE
      file:
        path: /var/www/html/ipxe
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy iPXE boot files to Nginx directory
      copy:
        src: "{{ item }}"
        dest: /var/www/html/ipxe/
        mode: '0644'
      with_items:
        - undionly.kpxe
        - ipxe.efi
        - boot.ipxe

    - name: Create Nginx configuration for iPXE
      template:
        src: ipxe-nginx.conf.j2
        dest: /etc/nginx/sites-available/ipxe
      notify:
        - reload nginx

    - name: Enable iPXE site in Nginx
      file:
        src: /etc/nginx/sites-available/ipxe
        dest: /etc/nginx/sites-enabled/ipxe
        state: link

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: restarted
        enabled: yes

    # Step 5: Copy iPXE boot menu script
    - name: Copy iPXE boot menu script
      copy:
        src: boot.ipxe
        dest: /var/www/html/ipxe/boot.ipxe
        mode: '0755'

  handlers:
    - name: restart isc-dhcp-server
      service:
        name: isc-dhcp-server
        state: restarted
        enabled: yes

    - name: restart tftpd-hpa
      service:
        name: tftpd-hpa
        state: restarted
        enabled: yes

    - name: reload nginx
      service:
        name: nginx
        state: reloaded
        enabled: yes
